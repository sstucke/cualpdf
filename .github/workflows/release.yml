name: Build cualpdf

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            qt_arch: ""
          - os: windows-latest
            name: windows
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            name: macos
            qt_arch: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.8.x (the last release is 6.8.3) still links "-framework AGL",
          # which macOS 26 (Tahoe) removed from its SDK, breaking macOS
          # builds with "ld: framework 'AGL' not found" (QTBUG-137687).
          # Fixed starting in 6.9.2/6.10.1; pinned to the latest verified
          # 6.9.x patch available for macOS.
          version: "6.9.3"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Instalar en install_output
        if: startsWith(github.ref, 'refs/tags/v')
        run: cmake --install build --config Release --prefix install_output

      - name: Empaquetar (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -C install_output -czf dist/cualpdf-linux-x64.tar.gz .

      - name: Empaquetar (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows'
        shell: pwsh
        run: |
          windeployqt install_output\bin\cualpdf.exe
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path install_output\bin\* -DestinationPath dist\cualpdf-windows-x64.zip

      - name: Empaquetar (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'macos'
        shell: bash
        run: |
          macdeployqt install_output/cualpdf.app

          APP="install_output/cualpdf.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          EXE="$APP/Contents/MacOS/cualpdf"

          # libpdfium.dylib is not a Qt framework, so macdeployqt does not
          # bundle it. Copy it in and repoint the executable's load command
          # at @rpath (macdeployqt already adds Contents/Frameworks to the
          # executable's rpath search list).
          mkdir -p "$FRAMEWORKS"
          PDFIUM_DYLIB=$(find build/_deps/pdfium-src/lib -name "libpdfium.dylib")
          cp "$PDFIUM_DYLIB" "$FRAMEWORKS/libpdfium.dylib"

          CURRENT_ID=$(otool -L "$EXE" | awk '/libpdfium/ {print $1}')
          if [ -n "$CURRENT_ID" ]; then
            install_name_tool -change "$CURRENT_ID" "@rpath/libpdfium.dylib" "$EXE"
          fi
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE" || true

          # Re-sign after modifying the bundle; Apple Silicon refuses to run
          # unsigned/altered binaries even with an ad-hoc signature missing.
          codesign --force --deep --sign - "$APP"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/cualpdf-macos-arm64.zip"

      - name: Guardar artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cualpdf-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          name: cualpdf ${{ github.ref_name }} — Public Beta
          prerelease: true
          generate_release_notes: true
          body: |
            **Beta software: expect bugs and keep backups.**
            The PDFs are serious; this build is still learning manners.
          files: release-assets/*
