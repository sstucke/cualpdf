name: Política de autoría

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar_atribuciones:
    name: Verificar atribuciones automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rechazar atribuciones automatizadas
        shell: bash
        run: |
          chmod +x scripts/check-ai-attribution.sh
          ./scripts/check-ai-attribution.sh --commits HEAD
